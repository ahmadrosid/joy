[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "joy-agent"
version = "0.1.0"
description = "A terminal coding agent"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "aisuite[openai]>=0.1.14,<0.2",
    "pydantic>=2,<3", # aisuite imports this but omits it from its base dependencies.
    "prompt-toolkit>=3.0.53,<4",
    "rich>=13,<15",
]

[project.scripts]
joy = "joy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/joy"]
